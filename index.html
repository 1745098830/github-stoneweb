<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title> Unity WebGL </title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <script src="TemplateData/UnityProgress.js"></script>
    <script src="Build/UnityLoader.js"></script>
    <!-- 在这里加入CSS规则 -->
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%; /* 保证占满整个屏幕宽度 */
            overflow: hidden; /* 防止出现滚动条 */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #unityContainer {
            width: 100% !important;
            height: 100% !important;
            background-color: black; /* 可选，设置背景颜色 */
        }

        canvas {
            width: 100%;
            height: 100%;
        }
    </style>
    <script>
        var unityInstance = UnityLoader.instantiate("unityContainer", "Build/githubstone_new.json", { onProgress: UnityProgress });
        window.addEventListener("resize", OnResize);
        // 拆分参数处理逻辑为独立函数
        function OnResize() {

            var canvas = document.getElementById('unity-canvas');
            // 更新 canvas 尺寸为浏览器窗口的尺寸
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            // 让 Unity 适应新的 canvas 尺寸
            if (unityInstance && unityInstance.Module) {
                // Unity WebGL 中的 `resizeCanvas` 方法
                unityInstance.Module.resizeCanvas(window.innerWidth, window.innerHeight);
            }

            unityInstance.SendMessage("DebugText", "SetWidth", window.innerWidth);
            unityInstance.SendMessage("DebugText", "SetHeight", window.innerHeight);
            unityInstance.SendMessage("DebugText", "OnResize");
        }
        // JavaScript: 获取URL参数并解析
        function getQueryParam(param) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(param);
        }
        // 参数映射标题
        const titleMap = {
            "TX": "天诩",
            "SQSM": "石全石美",
            "Test2": "天灵灵地灵灵",
            "Test": "天地玄黄宇宙洪荒",
            "UNITY": "Unity WebGL",
            "favicon": "天上老君急急如律令"
        };
        // 获取参数并设置标题
        const qybs = getQueryParam("QYBS");
        if (qybs && titleMap[qybs]) {
            document.title = titleMap[qybs];
        }
        // JavaScript: 动态设置网页图标
        function setDynamicIcon(iconUrl) {
            let link = document.querySelector("link[rel*='icon']") || document.createElement('link');
            link.type = 'image/x-icon';
            link.rel = 'shortcut icon';
            link.href = iconUrl;
            document.head.appendChild(link);
        }
        // 替换 favicon
        function setFavicon(iconName) {
            const head = document.getElementsByTagName('head')[0];
            let link = document.querySelector("link[rel~='icon']");
            if (!link) {
                link = document.createElement('link');
                link.rel = 'icon';
                head.appendChild(link);
            }
            link.href = `TemplateData/${iconName}.ico`;
        }

        // 根据参数 icon 设置 favicon
        const iconParam = getQueryParam("QYBS");
        if (iconParam) {
            setFavicon(iconParam);
        }
    </script>
</head>
  <body style="margin:0; overflow:hidden;">
      <div id="unityContainer"></div>
  </body>
</html>
